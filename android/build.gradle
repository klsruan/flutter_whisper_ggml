// Android NDK entry point for the flutter_whisper FFI library.
group = "com.klsruan.flutter_whisper"
version = "0.1.0"

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.11.1")
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

def prebuiltDir = file("src/main/jniLibs")
def usePrebuilt = prebuiltDir.isDirectory()
if (usePrebuilt) {
    ["arm64-v8a", "x86_64"].each { abi ->
        if (!new File(prebuiltDir, "$abi/libflutter_whisper_plugin.so").isFile()) {
            throw new GradleException("The packaged Whisper Android runtime is missing $abi.")
        }
    }
} else if (!file("../src/CMakeLists.txt").isFile()) {
    throw new GradleException("The packaged Whisper Android runtime is missing.")
}

android {
    namespace = "com.klsruan.flutter_whisper"
    compileSdk = 36
    if (!usePrebuilt) {
        externalNativeBuild {
            cmake {
                path = "../src/CMakeLists.txt"
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk = 24
        if (!usePrebuilt) {
            externalNativeBuild {
                cmake {
                    arguments "-DANDROID_STL=c++_static"
                }
            }
        }
        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
    }
}
